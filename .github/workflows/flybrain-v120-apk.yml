name: Build FlyBrain Instagram v1.2.0 APK
on:
  push:
    branches: [build/flybrain-instagram-v1.2.0]
    paths:
      - 'flybrain-v120-source.b64'
      - '.github/workflows/flybrain-v120-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Recreate source tree
        run: |
          base64 -d flybrain-v120-source.b64 > flybrain-v120-source.zip
          unzip -q flybrain-v120-source.zip
          mv flybrain-instagram-v1.2.0 flybrain-v120
      - name: Ensure Android SDK
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0" >/dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build APK
        working-directory: flybrain-v120
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK
        run: |
          test -f flybrain-v120/app/build/outputs/apk/debug/app-debug.apk
          sha256sum flybrain-v120/app/build/outputs/apk/debug/app-debug.apk
          ls -lh flybrain-v120/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FlyBrain-Doomscroll-Instagram-v1.2.0-APK
          path: flybrain-v120/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
