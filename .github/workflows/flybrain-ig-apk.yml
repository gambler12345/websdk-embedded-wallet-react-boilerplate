name: Build FlyBrain Instagram APK
on:
  push:
    branches: [build/flybrain-instagram-v1.1.0-final]
    paths:
      - 'flybrain-ig/**'
      - '.github/workflows/flybrain-ig-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Ensure Android SDK
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0" >/dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build APK
        working-directory: flybrain-ig
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK
        run: |
          test -f flybrain-ig/app/build/outputs/apk/debug/app-debug.apk
          sha256sum flybrain-ig/app/build/outputs/apk/debug/app-debug.apk
          ls -lh flybrain-ig/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FlyBrain-Doomscroll-Instagram-v1.1.0-APK
          path: flybrain-ig/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
