name: Build CCOP USB-C Power Monitor APK

on:
  push:
    branches:
      - build/ccop-usbc-power-monitor-apk-20260911
    paths:
      - 'ccop-usbc-power-monitor/**'
      - '.github/workflows/build-ccop-usbc-power-monitor.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        working-directory: ccop-usbc-power-monitor
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Rename APK
        run: |
          cp ccop-usbc-power-monitor/app/build/outputs/apk/debug/app-debug.apk CCOP-USB-C-LadeMonitor.apk
          sha256sum CCOP-USB-C-LadeMonitor.apk > CCOP-USB-C-LadeMonitor.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CCOP-USB-C-LadeMonitor-APK
          path: |
            CCOP-USB-C-LadeMonitor.apk
            CCOP-USB-C-LadeMonitor.apk.sha256
          if-no-files-found: error
          retention-days: 30
