name: Build AutoClickPoint APK

on:
  push:
    branches:
      - build/autoclickpoint-apk-20260922
    paths:
      - 'autoclickpoint-build/**'
      - '.github/workflows/build-autoclickpoint-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Configure Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Build debug APK
        working-directory: autoclickpoint-build
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Verify APK
        run: |
          APK=autoclickpoint-build/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          /usr/local/lib/android/sdk/build-tools/36.0.0/apksigner verify --verbose "$APK"
          /usr/local/lib/android/sdk/build-tools/36.0.0/aapt dump badging "$APK" | head -n 20

      - name: Prepare APK artifact
        run: |
          mkdir -p artifact
          cp autoclickpoint-build/app/build/outputs/apk/debug/app-debug.apk artifact/AutoClickPoint-v1.0.0.apk
          sha256sum artifact/AutoClickPoint-v1.0.0.apk > artifact/SHA256.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoClickPoint-v1.0.0-apk
          path: artifact/*
          if-no-files-found: error
          retention-days: 30
