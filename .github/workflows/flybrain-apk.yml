name: Build FlyBrain APK
on:
  push:
    branches: [build/flybrain-apk-20260913]
    paths:
      - 'flybrain-apk/**'
      - '.github/workflows/flybrain-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Ensure Android SDK
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0" >/dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build APK
        working-directory: flybrain-apk
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK
        run: ls -lh flybrain-apk/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FlyBrain-Doomscroll-Standalone-APK
          path: flybrain-apk/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
