plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ccop.usbcpowermonitor'
    compileSdk 35

    defaultConfig {
        applicationId 'com.ccop.usbcpowermonitor.safev4'
        minSdk 23
        targetSdk 35
        versionCode 4
        versionName '4.0.0-safe'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
